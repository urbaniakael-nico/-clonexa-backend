<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CLONEXA · Consola v2+</title>
  <link rel="icon" href="/assets/brand/favicon.ico?v=cx26a" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/assets/brand/clonexa-icono.svg?v=cx26a" />
  <link rel="apple-touch-icon" href="/assets/brand/clonexa-icono-180.png?v=cx26a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Cinzel:wght@900&family=JetBrains+Mono:wght@400;600&display=swap" />
  <link rel="stylesheet" href="/admin-v2plus.css" />
</head>
<body>
  <div class="vp-shell">
    <aside class="vp-sidebar">
      <div class="cx-brand">
        <div class="cx-logo-wrap is-cx-icon">
          <img class="cx-logo-img" src="/assets/brand/clonexa-icono.svg?v=cx26a" alt="Clonexa" />
          <div class="cx-logo-fallback" aria-hidden="true">CX</div>
        </div>
        <div>
          <div class="cx-brand-title"><img class="cx-brand-name" src="/assets/brand/clonexa-nombre.svg?v=cx26a" alt="CLONEXA" /></div>
          <div class="cx-brand-subtitle">Consola v2+</div>
        </div>
      </div>

      <nav class="vp-nav" aria-label="Navegación principal" data-vp-nav>
        <button class="vp-nav-item is-active" type="button" data-vp-view="command">Centro de mando</button>
        <button class="vp-nav-item" type="button" data-vp-view="companies">Empresas</button>
        <button class="vp-nav-item" type="button" data-vp-view="catalog">Catálogo</button>
        <button class="vp-nav-item" type="button" data-vp-view="switches">Interruptores</button>
        <button class="vp-nav-item" type="button" data-vp-view="brand">Estudio de marca</button>
        <button class="vp-nav-item" type="button" data-vp-view="menuvideo">Menú video</button>
        <button class="vp-nav-item" type="button" data-vp-view="access">Accesos y sesiones</button>
        <button class="vp-nav-item" type="button" data-vp-view="health">Salud y seguridad</button>
        <button class="vp-nav-item" type="button" data-vp-view="billing">Facturación</button>
        <button class="vp-nav-item" type="button" data-vp-view="landing">Landing</button>
      </nav>

      <button class="vp-nav-item vp-search-nav" type="button" data-vp-search>⌕ Buscar… <span class="vp-kbd">Ctrl K</span></button>
      <button class="vp-nav-item vp-passkey-btn" type="button" data-vp-passkeys-open>☝ Huella de este equipo</button>
      <button class="vp-nav-item vp-logout-btn" type="button" data-vp-logout-open>
        <svg class="vp-logout-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Cerrar sesión</span>
      </button>
    </aside>

    <main class="vp-main" id="vpMain" aria-live="polite">
      <p class="vp-loading">Cargando el Centro de mando…</p>
    </main>
  </div>

  <script src="/admin-v2plus-webauthn.js"></script>
  <script src="/admin-v2plus.js"></script>
  <script src="/admin-v2plus-companies.js"></script>
  <script src="/admin-v2plus-ficha.js"></script>
  <script src="/admin-v2plus-company.js"></script>
  <script src="/admin-v2plus-audit.js"></script>
  <script src="/admin-v2plus-catalog.js"></script>
  <script src="/admin-v2plus-admin.js"></script>
  <script src="/admin-v2plus-switches.js"></script>
  <script src="/admin-v2plus-brand.js"></script>
  <script src="/admin-v2plus-billing.js"></script>
  <script src="/admin-v2plus-menu-video.js"></script>
  <script src="/admin-v2plus-palette.js"></script>
