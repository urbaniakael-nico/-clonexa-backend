<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CLONEXA Login</title>
  <link rel="icon" href="/assets/brand/favicon.ico?v=cx26a" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/assets/brand/clonexa-icono.svg?v=cx26a" />
  <link rel="apple-touch-icon" href="/assets/brand/clonexa-icono-180.png?v=cx26a" />
  <link rel="stylesheet" href="/client-static/login.css?v=cx26a" />

  <style>
  .clonexa-login-watermark {
    position: fixed !important;
    left: 50% !important;
    top: 50% !important;
    transform: translate(-50%, -50%) !important;

    width: 165vw !important;
    height: 165vh !important;
    max-width: none !important;
    max-height: none !important;

    object-fit: contain !important;
    object-position: center 30% !important;

    z-index: 2 !important;
    opacity: 0.13 !important;
    pointer-events: none !important;
    user-select: none !important;

    filter:
      grayscale(1)
      sepia(1)
      saturate(4)
      hue-rotate(305deg)
      brightness(0.82)
      contrast(1.15)
      drop-shadow(0 0 60px rgba(239, 35, 60, 0.45)) !important;

    mix-blend-mode: screen !important;
  }

  .grid {
    z-index: 1 !important;
  }

  .login-shell {
    position: relative !important;
    z-index: 10 !important;
    min-height: 100vh !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }

  .login-card {
    position: relative !important;
    z-index: 20 !important;
    backdrop-filter: blur(10px) !important;
  }

  @media (max-width: 900px) {
    .clonexa-login-watermark {
      width: 220vw !important;
      height: 220vh !important;
      object-position: center 26% !important;
      opacity: 0.10 !important;
    }
  }
</style>
</head>

<body>
  <img class="clonexa-login-watermark" src="/assets/brand/clonexa-icono.svg?v=cx26a" alt="" aria-hidden="true" alt="" aria-hidden="true" />

  <div class="grid"></div>

  <main class="login-shell">
    <section class="login-card">
      <div class="brand">
        <img class="wordmark wordmark-logo" src="/assets/brand/clonexa-logo-horizontal.svg?v=cx26a" alt="CLONEXA" />
        <span class="status"><i></i> LIVE ACCESS</span>
      </div>

      <h1>Client Portal</h1>
      <p>Acceso empresarial seguro al sistema operativo en tiempo real.</p>

      <form id="loginForm">
        <label>Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="admin@empresa.com" required />

        <label>Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••••" required />

        <button type="submit">Entrar</button>
        <div id="loginMessage" class="message"></div>
      </form>

      <footer>CLONEXA SaaS Control Layer</footer>
    </section>
  </main>

  <script src="/client-static/login.js"></script>
</body>
</html>
